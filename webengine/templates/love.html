<!DOCTYPE html>
<html>

<head>

<title>Love Story</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#ff4d6d,
#ff85a1
);

font-family:
Arial,sans-serif;
}

.wave{

position:absolute;

bottom:-100px;

left:0;

width:200%;

height:250px;

background:
rgba(255,255,255,.15);

border-radius:45%;

animation:
wave 10s linear infinite;
}

.card{

width:1600px;

min-height:1200px;

background:
rgba(255,255,255,.15);

backdrop-filter:
blur(15px);

border-radius:25px;

padding:48px;

text-align:center;

box-shadow:
0 0 40px rgba(255,255,255,.4);

z-index:5;
}
#gifBox{

width:100%;

height:850px;

object-fit:cover;

border-radius:20px;

box-shadow:
0 0 30px rgba(255,255,255,.6);
}
#photoBox{

display:none;

max-width:100%;

max-height:1050px;

width:auto;

height:auto;

object-fit:contain;

border-radius:20px;

box-shadow:
0 0 30px rgba(255,255,255,.6);

transition:all .8s ease;
}
h1{

margin-top:20px;

color:white;
}

p{

margin-top:15px;

font-size:20px;

color:white;
}

#captionBox{

margin-top:20px;

background:
rgba(255,255,255,.95);

color:#ff4d6d;

padding:15px;

border-radius:20px;

font-size:22px;

font-weight:bold;

box-shadow:
0 0 20px white;
}

#fullGallery{

display:none;

position:fixed;

top:0;

left:0;

width:100vw;

height:100vh;

padding:30px;

background:
linear-gradient(
135deg,
#ff4d6d,
#ff85a1
);

grid-template-columns:
repeat(4,1fr);

gap:20px;

z-index:100;
}

#fullGallery img{

width:100%;

height:100%;

max-height:40vh;

object-fit:cover;

border-radius:20px;

box-shadow:
0 0 25px white;
}

#bigHeart{

display:none;

position:fixed;

left:50%;

top:50%;

transform:
translate(-50%,-50%)
scale(0);

font-size:550px;

z-index:9999;

text-align:center;
}

#loveText{

font-size:60px;

font-weight:bold;

color:white;

text-shadow:
0 0 20px white;
}

.heart{

position:absolute;

font-size:40px;

animation:
heartFloat 10s linear infinite;
}

.h1{left:10%;}
.h2{left:30%;}
.h3{left:60%;}
.h4{left:80%;}

@keyframes fade{

from{

opacity:0;

transform:
translateY(40px);
}

to{

opacity:1;

transform:
translateY(0);
}
}

@keyframes wave{

from{
transform:translateX(0);
}

to{
transform:translateX(-50%);
}
}

@keyframes heartFloat{

0%{

transform:
translateY(100vh);

opacity:0;
}

20%{
opacity:1;
}

100%{

transform:
translateY(-120vh);

opacity:0;
}
}

@keyframes heartPop{

0%{

transform:
translate(-50%,400px)
scale(0);

opacity:0;
}

50%{

transform:
translate(-50%,-50%)
scale(1.4);

opacity:1;
}

100%{

transform:
translate(-50%,-50%)
scale(1);
}
}
</style>

</head>
<body>

<div class="wave"></div>

<div class="heart h1">❤️</div>
<div class="heart h2">❤️</div>
<div class="heart h3">❤️</div>
<div class="heart h4">❤️</div>

<div class="card">

    <div id="storyScene">
<img
id="gifBox"
src="/static/gifs/gif1.gif"
>

<img
id="photoBox"
style="display:none;"
>
        <h1>
            ❤️ {{ name }}
        </h1>

        <p>
            {{ message }}
        </p>

        <div id="captionBox">

            Loading...

        </div>

    </div>

</div>


<div id="fullGallery">

{% for image in images %}

<img
src="/static/uploads/{{ image }}"
>

{% endfor %}

</div>


<div id="bigHeart">

❤️

<div id="loveText">

LOVE YOU ❤️

</div>

</div>

<script>
let gifs = [

"/static/gifs/gif1.gif",
"/static/gifs/gif2.gif",
"/static/gifs/gif3.gif",
"/static/gifs/gif4.gif",
"/static/gifs/gif5.gif"

];

let photos = [

{% for image in images %}

"/static/uploads/{{ image }}",

{% endfor %}

];

let captions = [

{% for caption in caption %}

"{{ caption|escapejs }}",

{% endfor %}

];

let gifBox =
document.getElementById(
"gifBox"
);

let photoBox =
document.getElementById(
"photoBox"
);

let captionBox =
document.getElementById(
"captionBox"
);

let gifIndex = 0;

let photoIndex = 0;

function showBigHeart(){

    document
    .getElementById(
    "bigHeart"
    )
    .style.display =
    "block";

    document
    .getElementById(
    "bigHeart"
    )
    .style.animation =
    "heartPop 2s ease forwards";
}

function startPhotos(){

    gifBox.style.display =
    "none";

    photoBox.style.display =
    "block";

    photoBox.src =
    photos[0];

    captionBox.innerHTML =
    captions[0] || "";

    let photoTimer =
    setInterval(()=>{

        photoIndex++;

        if(
            photoIndex >=
            photos.length
        ){

            clearInterval(
            photoTimer
            );

            document
            .querySelector(
            ".card"
            )
            .style.display =
            "none";

            document
            .getElementById(
            "fullGallery"
            )
            .style.display =
            "grid";

            setTimeout(()=>{

                showBigHeart();

            },5000);

            return;
        }

        photoBox.src =
        photos[photoIndex];

        captionBox.innerHTML =
        captions[photoIndex] || "";

    },2000);

}

let gifTimer =
setInterval(()=>{

    gifIndex++;

    if(
        gifIndex >=
        gifs.length
    ){

        clearInterval(
        gifTimer
        );

        startPhotos();

        return;
    }

    gifBox.src =
    gifs[gifIndex];

},2000);
</script>

</body>

</html>
