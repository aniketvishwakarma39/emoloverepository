<!DOCTYPE html>
<html>

<head>

<title>Love Theme</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#ff5c8d;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    font-family:Arial;
}

.card{

    width:800px;

    height:550px;

    background:white;

    border-radius:25px;

    padding:20px;

    text-align:center;

    box-shadow:
    0 0 40px rgba(255,255,255,.7);

    animation:fade 1s;
}

#mainImage{

    width:400px;

    height:250px;

    object-fit:cover;

    border-radius:20px;
}

h1{

    margin-top:20px;

    color:#ff006e;
}

p{

    margin-top:15px;

    font-size:20px;
}

#finalScene{

    display:none;
}

.grid{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:10px;

    margin-top:20px;
}

.grid img{

    width:100%;

    height:150px;

    object-fit:cover;

    border-radius:15px;
}

@keyframes fade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

</style>

</head>

<body>

<div class="card">

    <div id="storyScene">

        <img
            id="mainImage"
            src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
        >

        <h1>
         <!--   ❤️ I Love You --> hello{{ name }}
        </h1>

        <p id="messageText">
            {{ message }}
        </p>

    </div>

    <div id="finalScene">

        <h1>
       <!--     ❤️ Forever ❤️-->do it anyway
        </h1>

        <div class="grid">

            <img src="https://picsum.photos/200?1">
            <img src="https://picsum.photos/200?2">
            <img src="https://picsum.photos/200?3">
            <img src="https://picsum.photos/200?4">
            <img src="https://picsum.photos/200?5">
            <img src="https://picsum.photos/200?6">
            <img src="https://picsum.photos/200?7">
            <img src="https://picsum.photos/200?8">

        </div>

    </div>

</div>

<script>

let gifs = [

"https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif",

"https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif",

"https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif",

"https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif",

"https://media.giphy.com/media/xT0xeJpnrWC4XWblEk/giphy.gif",

"https://media.giphy.com/media/5GoVLqeAOo6PK/giphy.gif"

];

let gifIndex = 0;

let gifBox =
document.getElementById("mainImage");

let timer = setInterval(() => {

    gifIndex++;

    if(gifIndex >= gifs.length){

        clearInterval(timer);

        document
        .getElementById("storyScene")
        .style.display="none";

        document
        .getElementById("finalScene")
        .style.display="block";

        return;
    }

    gifBox.src = gifs[gifIndex];

},2000);

</script>

</body>

</html>
