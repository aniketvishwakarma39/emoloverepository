<!DOCTYPE html>
<html>
<head>
    <title>Birthday</title>
</head>
<style>
body{

margin:0;

overflow:hidden;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#ff66a3,
#ff99cc
);

font-family:
sans-serif;
}

#countdown{

position:absolute;

font-size:180px;

font-weight:bold;

color:white;

text-shadow:
0 0 40px white;
}

#cakeScene{

display:none;

position:relative;
}

#cake{

position:relative;

width:400px;

height:350px;

cursor:pointer;
}

.layer{

position:absolute;

left:50%;

transform:
translateX(-50%);

border-radius:30px;

opacity:0;

box-shadow:
0 15px 30px rgba(
0,
0,
0,
.25
);
}

.bottom{

width:340px;

height:100px;

background:
linear-gradient(
to bottom,
#8b4513,
#5e2f0d
);

bottom:0;
}

.middle{

width:280px;

height:90px;

background:
linear-gradient(
to bottom,
#9c5c2b,
#6e3f1f
);

bottom:95px;
}

.top{

width:220px;

height:80px;

background:
linear-gradient(
to bottom,
#b86d35,
#7a4520
);

bottom:180px;
}

.cream{

position:absolute;

top:0;

left:0;

width:100%;

height:25px;

background:
#fff6e8;

border-radius:
25px 25px 15px 15px;
}

.cream::before{

content:"";

position:absolute;

width:100%;

height:18px;

top:18px;

background:
radial-gradient(
circle at 20px 0,
#fff6e8 12px,
transparent 13px
);

background-size:
40px 20px;
}

.strawberry{

width:22px;

height:22px;

background:red;

border-radius:50%;

position:absolute;

top:-15px;

box-shadow:
0 0 10px red;
}

.s1{

left:20%;
}

.s2{

left:50%;

transform:
translateX(-50%);
}

.s3{

right:20%;
}

.candles{

position:absolute;

bottom:250px;

left:50%;

transform:
translateX(-50%);

display:none;

gap:20px;
}

.candle{

width:12px;

height:60px;

background:white;

position:relative;

border-radius:10px;
}

.candle::after{

content:"";

position:absolute;

top:-15px;

left:50%;

transform:
translateX(-50%);

width:12px;

height:12px;

background:orange;

border-radius:50%;

box-shadow:
0 0 20px orange;

animation:
flicker .5s infinite;
}

#birthdayTitle{

display:none;

position:absolute;

font-size:70px;

font-weight:bold;

color:white;

text-align:center;

text-shadow:
0 0 30px white;
}

@keyframes flicker{

50%{

transform:
translateX(-50%)
scale(1.2);
}
}

@keyframes jellyDrop{

0%{

transform:
translate(
-50%,
-600px
)
scaleY(
1.3
);
}

70%{

transform:
translate(
-50%,
0
)
scaleY(
.6
);
}

85%{

transform:
translate(
-50%,
-20px
)
scaleY(
1.15
);
}

100%{

transform:
translate(
-50%,
0
)
scaleY(
1
);
}
}
</style>
<body>

<div id="countdown">

3

</div>

<div id="cakeScene">

    <div id="cake">

        <div class="layer bottom">

            <div class="cream"></div>

        </div>

        <div class="layer middle">

            <div class="cream"></div>

        </div>

        <div class="layer top">

            <div class="cream"></div>

            <div class="strawberry s1"></div>
            <div class="strawberry s2"></div>
            <div class="strawberry s3"></div>

        </div>

        <div class="candles">

            <div class="candle"></div>

            <div class="candle"></div>

            <div class="candle"></div>

        </div>

    </div>

</div>

<div id="birthdayTitle">

    HAPPY BIRTHDAY

    <br>

    {{ name }}

</div>

<div id="heartRain"></div>

<script>
    let count = 3;

let countdown =
document.getElementById(
"countdown"
);

let cakeScene =
document.getElementById(
"cakeScene"
);

let title =
document.getElementById(
"birthdayTitle"
);

let cake =
document.getElementById(
"cake"
);

let bottom =
document.querySelector(
".bottom"
);

let middle =
document.querySelector(
".middle"
);

let topLayer =
document.querySelector(
".top"
);

let candles =
document.querySelector(
".candles"
);

let timer =
setInterval(()=>{

count--;

if(count > 0){

countdown.innerHTML =
count;

}
else{

clearInterval(
timer
);

countdown.style.display =
"none";

cakeScene.style.display =
"block";

buildCake();
}

},1000);


function buildCake(){

bottom.style.opacity = 1;

bottom.style.animation =
"jellyDrop 1.2s forwards";

setTimeout(()=>{

middle.style.opacity = 1;

middle.style.animation =
"jellyDrop 1.2s forwards";

},1200);

setTimeout(()=>{

topLayer.style.opacity = 1;

topLayer.style.animation =
"jellyDrop 1.2s forwards";

},2400);

setTimeout(()=>{

candles.style.display =
"flex";

heartRain();

},3600);

setTimeout(()=>{

title.style.display =
"block";

title.animate(
[
{
transform:"scale(0)",
opacity:0
},
{
transform:"scale(1)",
opacity:1
}
],
{
duration:1000,
fill:"forwards"
}
);

},5000);

}


function heartRain(){

setInterval(()=>{

let heart =
document.createElement(
"div"
);

heart.innerHTML =
"❤️";

heart.style.position =
"fixed";

heart.style.left =
Math.random()*100 + "vw";

heart.style.top =
"-50px";

heart.style.fontSize =
(20 + Math.random()*40) + "px";

heart.style.zIndex =
9999;

document.body.appendChild(
heart
);

heart.animate(
[
{
transform:
"translateY(0)"
},
{
transform:
"translateY(120vh)"
}
],
{
duration:4000
}
);

setTimeout(()=>{

heart.remove();

},4000);

},200);

}


cake.addEventListener(
"mouseenter",
cutCake
);


let cutDone = false;

function cutCake(){

if(cutDone){

return;

}

cutDone = true;

topLayer.animate(
[
{
transform:
"translateX(-50%)"
},
{
transform:
"translateX(-170px) rotate(-15deg)"
}
],
{
duration:1200,
fill:"forwards"
}
);

middle.animate(
[
{
transform:
"translateX(-50%)"
},
{
transform:
"translateX(70px) rotate(15deg)"
}
],
{
duration:1200,
fill:"forwards"
}
);

setTimeout(()=>{

blast();

},1200);

}


function blast(){

for(let i=0;i<120;i++){

let p =
document.createElement(
"div"
);

let emojis = [

"🎉",
"🎊",
"✨",
"🎂",
"❤️"

];

p.innerHTML =
emojis[
Math.floor(
Math.random()*emojis.length
)
];

p.style.position =
"fixed";

p.style.left =
"50%";

p.style.top =
"50%";

p.style.fontSize =
(20 + Math.random()*40) + "px";

p.style.zIndex =
99999;

document.body.appendChild(
p
);

let x =
(Math.random()-0.5)*1500;

let y =
(Math.random()-0.5)*1500;

p.animate(
[
{
transform:
"translate(0,0)"
},
{
transform:
`translate(${x}px,${y}px)`
}
],
{
duration:2500
}
);

setTimeout(()=>{

p.remove();

},2500);

}

}
</script>
</body>
</html>
